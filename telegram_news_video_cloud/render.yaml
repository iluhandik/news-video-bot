services:
  - type: web
    name: telegram-news-video-bot
    env: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/status
    envVars:
      - key: TELEGRAM_CHANNEL_ID
        value: "@your_news_channel"
      - key: CHANNEL_DISPLAY_NAME
        value: "ГОЛОВНІ НОВИНИ UA"
      - key: CHANNEL_USERNAME
        value: "@your_news_channel"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: VOICE_NAME
        value: "uk-UA-OstapNeural"
